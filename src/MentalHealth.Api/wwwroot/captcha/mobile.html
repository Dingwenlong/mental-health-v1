<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-mental-health-captcha' https://o.alicdn.com; connect-src https://*.alicdn.com https://*.aliyuncs.com; img-src data: https://*.alicdn.com https://*.aliyuncs.com; style-src 'unsafe-inline' https://*.alicdn.com https://*.aliyuncs.com; font-src https://*.alicdn.com https://*.aliyuncs.com; frame-src https://*.alicdn.com https://*.aliyuncs.com; base-uri 'none'; form-action 'none'; object-src 'none'">
  <title></title>
  <style>
    html, body { width: 100%; height: 100%; margin: 0; background: #fff; }
    #captcha-button { position: fixed; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="captcha-element"></div>
  <button id="captcha-button" type="button" aria-hidden="true" tabindex="-1"></button>
  <script nonce="mental-health-captcha">
    (() => {
      'use strict';

      const channel = window.MentalHealthCaptcha;
      const query = new URLSearchParams(window.location.search);
      const prefix = query.get('prefix');
      const encryptedSceneId = query.get('encryptedSceneId');
      let completed = false;

      function postFixedStatus(status) {
        if (completed) return;
        completed = true;
        channel.postMessage(status);
      }

      if (!channel || !prefix || !encryptedSceneId || query.size !== 2) {
        if (channel) postFixedStatus('captcha_init_error');
        return;
      }

      window.AliyunCaptchaConfig = { region: 'cn', prefix };
      window.addEventListener('error', () => postFixedStatus('captcha_init_error'));

      const script = document.createElement('script');
      script.src = 'https://o.alicdn.com/captcha-frontend/aliyunCaptcha/AliyunCaptcha.js';
      script.async = true;
      script.onerror = () => postFixedStatus('captcha_init_error');
      script.onload = () => {
        try {
          window.initAliyunCaptcha({
            SceneId: 'e20maaxh',
            EncryptedSceneId: encryptedSceneId,
            mode: 'popup',
            element: '#captcha-element',
            button: '#captcha-button',
            language: 'cn',
            delayBeforeSuccess: false,
            slideStyle: { width: 360, height: 40 },
            success: function (captchaVerifyParam) {
              if (completed) return;
              completed = true;
              window.MentalHealthCaptcha.postMessage(captchaVerifyParam);
            },
            fail: function () {
              postFixedStatus('captcha_failed');
            },
            onError: function () {
              postFixedStatus('captcha_init_error');
            },
            onClose: function (reason) {
              postFixedStatus(reason === 'userDismiss' ? 'captcha_closed' : 'captcha_failed');
            },
            getInstance: function (instance) {
              window.setTimeout(() => {
                if (completed || !instance || typeof instance.startTracelessVerification !== 'function') {
                  postFixedStatus('captcha_init_error');
                  return;
                }
                instance.startTracelessVerification();
              }, 2100);
            },
          });
        } catch (_) {
          postFixedStatus('captcha_init_error');
        }
      };
      document.head.appendChild(script);
    })();
  </script>
</body>
</html>
